name: "Copilot Setup Steps"

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/copilot-setup-steps.yml"
      - "rust-toolchain.toml"
      - "src/rust/rustfmt.toml"
      - "src/rust/deny.toml"
  pull_request:
    paths:
      - ".github/workflows/copilot-setup-steps.yml"
      - "rust-toolchain.toml"
      - "src/rust/rustfmt.toml"
      - "src/rust/deny.toml"

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5.4.0
        with:
          global-json-file: global.json

      - name: Install Rust toolchain and components
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.88.0
          rustc --version
          cargo --version

      - name: Install protobuf and C build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler build-essential pkg-config
          protoc --version

      - name: Install Buf CLI
        uses: bufbuild/buf-action@v1.4.0
        with:
          version: 1.50.0
          github_token: ${{ github.token }}
          setup_only: true

      - name: Install prebuilt cargo-deny
        uses: taiki-e/install-action@073e1fd0bc889c9aee68dbaaa927cde1b5653a83 # v2.90.11
        with:
          tool: cargo-deny@0.20.2
          fallback: none

      - name: Verify key developer tools
        run: |
          cargo fmt --version
          cargo clippy --version
          cargo deny --version
          buf --version
          dotnet --version
