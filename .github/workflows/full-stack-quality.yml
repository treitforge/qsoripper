name: Full-Stack Quality

on:
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * 1'  # Weekly on Monday at 08:17 UTC

permissions:
  contents: read

jobs:
  rust:
    name: Rust Quality
    uses: ./.github/workflows/rust-quality.yml

  dotnet:
    name: .NET Quality
    uses: ./.github/workflows/dotnet-quality.yml

  win32:
    name: Win32 Quality
    uses: ./.github/workflows/win32-quality.yml

  powershell:
    name: PowerShell Quality
    uses: ./.github/workflows/powershell-quality.yml

  conformance:
    name: Engine Conformance
    uses: ./.github/workflows/engine-conformance.yml
